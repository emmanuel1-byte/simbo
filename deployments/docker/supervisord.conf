[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; ── Go API server ──────────────────────────────────────────────────────────────
[program:backend]
command=/app/api
directory=/app
user=simbo
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; Backend starts first — must be ready before the frontend serves requests.
priority=10

; ── Next.js node server ────────────────────────────────────────────────────────
[program:frontend]
command=node /app/frontend/server.js
directory=/app/frontend
user=simbo
autostart=true
autorestart=true
startretries=5
startsecs=3
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="3000",HOSTNAME="0.0.0.0"
priority=20
